name: sirius_agro
description: "Copiloto de campo: graba la conversacion de una visita, extrae los datos y entrega diagnostico e informe"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.1+6

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  record: ^7.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  http: ^1.6.0
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  uuid: ^4.6.0
  flutter_riverpod: ^2.6.1
  permission_handler: ^13.0.1
  geolocator: ^13.0.2
  flutter_foreground_task: ^9.1.0
  camera: ^0.11.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path: ^1.9.0
  bcrypt: ^1.2.0
  share_plus: ^13.3.0
  pdf: ^3.13.0
  printing: ^5.15.0
  archive: ^4.0.9
  connectivity_plus: ^7.3.1
  image_picker: ^1.2.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Semilla offline: la app debe conocer las veredas y los obligatorios en el
    # primer arranque, en un potrero y sin red.
    - assets/semilla/veredas.json
    - assets/semilla/catalogo.json
    - assets/semilla/visitadores.json
    # Marca: wordmark a color y version blanca para tema oscuro.
    - assets/marca/sirius.png
    - assets/marca/sirius_blanco.png
    # Los mismos dos, en vector, para los PDF: el logo del papel se dibuja
    # desde su contorno y no se pixela por mucho que se amplie o se imprima.
    - assets/marca/sirius.svg
    - assets/marca/sirius_blanco.svg
    # Y el mono blanco —logo y puntos en blanco—, para el membrete: sobre Azul
    # Cielo el punto Azul Cielo del logo a color desapareceria.
    - assets/marca/sirius_mono_blanco.svg
    # Museo Slab: la corporativa de Sirius. Va como asset ademas de como
    # fuente porque el generador de PDF no lee el registro de fuentes de
    # Flutter, carga el archivo a mano.
    #
    # Convertidas de OTF a TTF: las originales llevan contornos CFF y el
    # generador de PDF solo sabe leer TrueType. Cubren todo el latin que la
    # app escribe —tildes, «», —, ², ±— asi que la conversion no pierde nada.
    - assets/fuentes/MuseoSlab-300.ttf
    - assets/fuentes/MuseoSlab-500.ttf
    - assets/fuentes/MuseoSlab-700.ttf
    - assets/fuentes/MuseoSlab-900.ttf
    - assets/fuentes/MuseoSlab-500Italic.ttf
    - assets/fuentes/MuseoSlab-700Italic.ttf
    # Los 14 iconos de modulo, recortados de la tipografia de Material: 3 KB
    # en vez de los 350 KB de la fuente entera. Son los mismos glifos que la
    # app dibuja en pantalla, para que el informe y el telefono no muestren
    # dos simbolos distintos para «Suelos».
    - assets/fuentes/IconosModulo.ttf
    # Roboto (Apache 2.0) queda como reserva del PDF: si algun dia un dato
    # trae un caracter que Museo Slab no dibuja, sale en Roboto y no como un
    # cuadro vacio en el papel que se le entrega al productor.
    - assets/fuentes/Roboto-Regular.ttf
    - assets/fuentes/Roboto-Bold.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Museo Slab, la tipografia corporativa. Los pesos de Museo no coinciden
  # con los de Material —su "regular" es el 500 y su "bold" el 700—, asi que
  # cada peso se declara contra el numero que el codigo ya usa: un titulo
  # escrito `FontWeight.w600` tiene que salir en Museo Slab 700, no en una
  # interpolacion que el motor elija por su cuenta.
  fonts:
    # Los iconos de modulo, la misma fuente que carga el PDF. Se declara como
    # familia para poder dibujarla con `Icon()` en pantalla: asi el telefono y
    # el papel salen del mismo archivo y no pueden discrepar.
    - family: IconosModulo
      fonts:
        - asset: assets/fuentes/IconosModulo.ttf

    - family: MuseoSlab
      fonts:
        - asset: assets/fuentes/MuseoSlab-300.ttf
          weight: 300
        - asset: assets/fuentes/MuseoSlab-500.ttf
          weight: 400
        - asset: assets/fuentes/MuseoSlab-500.ttf
          weight: 500
        - asset: assets/fuentes/MuseoSlab-700.ttf
          weight: 600
        - asset: assets/fuentes/MuseoSlab-700.ttf
          weight: 700
        - asset: assets/fuentes/MuseoSlab-900.ttf
          weight: 900
        - asset: assets/fuentes/MuseoSlab-500Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fuentes/MuseoSlab-700Italic.ttf
          weight: 700
          style: italic

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
